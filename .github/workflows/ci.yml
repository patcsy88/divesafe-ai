name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: divesafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIVESAFE_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/divesafe_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Safety suite (must pass; nothing in it may skip here)
        shell: bash # explicit bash enables pipefail, so a failing pytest is not hidden by tee
        run: pytest -m safety -rs --color=no | tee safety.log
      - name: Fail if a safety test was skipped (only the case-sensitive-volume check may skip on Linux)
        run: |
          awk '/SKIPPED/ && !/^SKIPPED \[[0-9]+\] tests\/evaluation\/test_capture_item6_offline\.py:[0-9]+: this volume is case-sensitive;/ {bad=1} END {exit bad}' safety.log
      - name: Full suite (the PostgreSQL tests must run, not skip)
        shell: bash # explicit bash enables pipefail, so a failing pytest is not hidden by tee
        run: pytest -rs | tee pytest.log
      - name: Fail if the PostgreSQL tests were skipped
        run: "! grep -q 'DIVESAFE_TEST_DATABASE_URL not set' pytest.log"
      - name: Fail if the restore round-trip test (pg_dump / pg_restore in the service) was skipped
        run: "! grep -q 'restore round trip cannot run:' pytest.log"
      - name: Known vulnerabilities in Python dependencies (pip-audit, CI only)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet "pip-audit==2.10.1"
          /tmp/audit/bin/pip-audit --progress-spinner off .

  image:
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build docker/Dockerfile
        run: docker build -f docker/Dockerfile -t divesafe-ci .
      - name: The image runs Python 3.14 with the reviewed Unicode data, as the unprivileged user
        run: |
          docker run --rm --network none --entrypoint python divesafe-ci -c '
          import os, sys, unicodedata
          import divesafe.api.app
          assert sys.version_info[:2] == (3, 14), sys.version
          assert unicodedata.unidata_version == "16.0.0", unicodedata.unidata_version
          assert os.getuid() == 10001, os.getuid()
          print(sys.version.split()[0], unicodedata.unidata_version, os.getuid())
          '

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Known vulnerabilities in runtime dependencies (from the lockfile, before install)
        run: npm audit --omit=dev --package-lock-only
      - name: No locked package has an install script (a new one needs review, not a silent skip)
        run: "! grep -q '\"hasInstallScript\"' package-lock.json"
      - name: Install exactly what the lockfile pins, without install scripts
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Build (no secret is needed to build)
        run: npm run build
