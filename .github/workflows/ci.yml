name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: divesafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIVESAFE_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/divesafe_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Safety suite (must pass; nothing in it may skip here)
        shell: bash # explicit bash enables pipefail, so a failing pytest is not hidden by tee
        run: pytest -m safety -rs --color=no | tee safety.log
      - name: Fail if a safety test was skipped (only the case-sensitive-volume check may skip on Linux)
        run: |
          awk '/SKIPPED/ && !/^SKIPPED \[[0-9]+\] tests\/evaluation\/test_capture_item6_offline\.py:[0-9]+: this volume is case-sensitive;/ {bad=1} END {exit bad}' safety.log
      - name: Full suite (the PostgreSQL tests must run, not skip)
        shell: bash # explicit bash enables pipefail, so a failing pytest is not hidden by tee
        run: pytest -rs | tee pytest.log
      - name: Fail if the PostgreSQL tests were skipped
        run: "! grep -q 'DIVESAFE_TEST_DATABASE_URL not set' pytest.log"
      - name: Fail if the restore round-trip test (pg_dump / pg_restore in the service) was skipped
        run: "! grep -q 'restore round trip cannot run:' pytest.log"
      - name: Known vulnerabilities in Python dependencies (pip-audit, CI only)
        run: |
          python -m venv --clear /tmp/audit
          /tmp/audit/bin/pip install --quiet "pip-audit==2.10.1"
          /tmp/audit/bin/pip-audit --progress-spinner off .
      - name: Known vulnerabilities in the evaluation extra (pip-audit, CI only; never in the image)
        run: |
          /tmp/audit/bin/python -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print("\n".join([*p["dependencies"], *p["optional-dependencies"]["eval"]]))' > /tmp/eval-requirements.txt
          grep -qx 'langfuse==[0-9.]*' /tmp/eval-requirements.txt
          /tmp/audit/bin/pip-audit --progress-spinner off -r /tmp/eval-requirements.txt

  image:
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build docker/Dockerfile
        run: docker build -f docker/Dockerfile -t divesafe-ci .
      - name: The image runs Python 3.14 with the reviewed Unicode data, as the unprivileged user
        run: |
          docker run --rm --network none --entrypoint python divesafe-ci -c '
          import os, sys, unicodedata
          import divesafe.api.app
          from divesafe.services.kb_screen import REVIEWED_UNIDATA_VERSION
          assert sys.version_info[:2] == (3, 14), sys.version
          assert unicodedata.unidata_version == REVIEWED_UNIDATA_VERSION, unicodedata.unidata_version
          assert os.getuid() == 10001, os.getuid()
          print(sys.version.split()[0], unicodedata.unidata_version, os.getuid())
          '
      - name: The image has the OpenTelemetry SDK and exporter, and no Langfuse SDK or auto-instrumentation
        run: |
          docker run --rm --network none --entrypoint python divesafe-ci -c '
          import importlib.metadata as md, importlib.util, shutil, sys
          import opentelemetry.sdk.trace, opentelemetry.exporter.otlp.proto.http.trace_exporter
          names = {(d.metadata["Name"] or "").lower().replace("_", "-") for d in md.distributions()}
          banned = [n for n in names if "langfuse" in n
                    or n.startswith(("opentelemetry-distro", "opentelemetry-instrumentation"))]
          assert not banned, banned
          assert importlib.util.find_spec("langfuse") is None
          assert shutil.which("opentelemetry-instrument") is None
          assert shutil.which("opentelemetry-bootstrap") is None
          print(sorted(n for n in names if n.startswith("opentelemetry")))
          '

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Known vulnerabilities in runtime dependencies (from the lockfile, before install)
        run: npm audit --omit=dev --package-lock-only
      - name: No locked package has an install script (a new one needs review, not a silent skip)
        run: "! grep -q '\"hasInstallScript\"' package-lock.json"
      - name: Install exactly what the lockfile pins, without install scripts
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Build (no secret is needed to build)
        run: npm run build
      - name: No Adobe React Spectrum code in the build (ADR 0017)
        run: node scripts/check-no-spectrum.mjs
      - name: The built CSS loads nothing from elsewhere (ADR 0017)
        run: node scripts/check-built-css.mjs

  web-image:
    name: web docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build docker/Dockerfile.web (ADR 0017)
        run: docker build -f docker/Dockerfile.web -t divesafe-web-ci .
      - name: The web image runs as node and holds no sharp, @img or .env file (owner #17)
        run: |
          docker run --rm --network none --entrypoint sh divesafe-web-ci -c '
          set -eu
          [ "$(id -u)" = 1000 ] || { echo "not uid 1000" >&2; exit 1; }
          [ "$(id -un)" = node ] || { echo "not the node user" >&2; exit 1; }
          if find /web /usr/local/lib/node_modules \( -name sharp -o -name "@img" -o -name ".env*" \) | grep .; then exit 1; fi
          '
      - name: The built UI carries the degraded-evidence note (ADR 0008 Amendment 1, Open preconditions (a))
        run: |
          docker run --rm --network none --entrypoint sh divesafe-web-ci -c \
            'grep -rqF --include="*.js" "based on model and forecast data, not observations" /web/.next/server'
      - name: The launcher refuses a secret in the environment and a missing or malformed secret file
        run: |
          d="$RUNNER_TEMP/web-secrets"
          mkdir -m 755 "$d"
          printf '%064d' 0 | tr 0 c > "$d/divesafe_web_session_secret"
          head -c 32 /dev/zero | base64 | tr -d '\n' > "$d/divesafe_web_actions_key"
          chmod 444 "$d"/*
          # Each run must refuse at once. If one starts Next instead, `timeout` ends it: the init passes
          # the signal on to Node (as PID 1 Node would ignore it), and -k ends the client regardless.
          if timeout -k 10 60 docker run --rm --init --network none -e NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=x -v "$d:/run/secrets:ro" divesafe-web-ci 2>"$RUNNER_TEMP/err"; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/err")" = "web-start: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must not be set in the environment"
          if timeout -k 10 60 docker run --rm --init --network none -e DIVESAFE_WEB_SESSION_SECRET=x -v "$d:/run/secrets:ro" divesafe-web-ci 2>"$RUNNER_TEMP/err"; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/err")" = "web-start: DIVESAFE_WEB_SESSION_SECRET must not be set in the environment"
          if timeout -k 10 60 docker run --rm --init --network none divesafe-web-ci 2>"$RUNNER_TEMP/err"; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/err")" = "web-start: cannot read the secret file for DIVESAFE_WEB_SESSION_SECRET"
          m="$RUNNER_TEMP/web-bad"
          mkdir -m 755 "$m"
          printf abc > "$m/divesafe_web_session_secret"
          cp "$d/divesafe_web_actions_key" "$m/"
          chmod 444 "$m"/*
          if timeout -k 10 60 docker run --rm --init --network none -v "$m:/run/secrets:ro" divesafe-web-ci 2>"$RUNNER_TEMP/err"; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/err")" = "web-start: the secret file for DIVESAFE_WEB_SESSION_SECRET is not in the expected form"
      - name: With throwaway secret files and no network, /login answers 200 from one process (owner #42, #55)
        run: |
          d="$RUNNER_TEMP/web-secrets"
          trap 'docker rm -f web-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name web-ci --network none --read-only --init \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev --memory 512m --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$d:/run/secrets:ro" divesafe-web-ci
          ok=
          for _ in $(seq 60); do
            if docker exec web-ci node -e 'fetch("http://127.0.0.1:3100/login").then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))'; then ok=1; break; fi
            sleep 1
          done
          docker logs web-ci 2>&1 | tail -20
          test -n "$ok"
          if docker inspect web-ci --format '{{json .Config.Env}}' | grep -qE 'SESSION_SECRET|ENCRYPTION_KEY'; then exit 1; fi
          # A few pages, then: one Node process besides the init (a child would inherit process.env),
          # and no process environment holds a secret name. The launcher's own values are set after
          # exec, so they never appear in /proc/<pid>/environ; this catches children and the image env.
          docker exec web-ci node -e 'Promise.all(["/","/nope","/login"].map(p=>fetch("http://127.0.0.1:3100"+p,{redirect:"manual"}))).then(()=>process.exit(0),()=>process.exit(1))'
          test "$(docker top web-ci -o pid,comm | tail -n +2 | grep -cv docker-init)" = 1
          docker exec web-ci sh -c 'set -e; p=; for c in /proc/[0-9]*/comm; do case "$(cat "$c" 2>/dev/null)" in next-server*) p="${c%/comm}";; esac; done; [ -n "$p" ]; tr "\0" "\n" < "$p/environ"; for e in /proc/[0-9]*/environ; do tr "\0" "\n" < "$e" 2>/dev/null || true; done' > "$RUNNER_TEMP/env.txt"
          grep -q '^NODE_ENV=production$' "$RUNNER_TEMP/env.txt"
          if grep -qE 'SESSION_SECRET|ENCRYPTION_KEY' "$RUNNER_TEMP/env.txt"; then echo "secret name in a process environment" >&2; exit 1; fi
          # The runtime key wins over the build manifest's.
          docker exec web-ci grep -qF 'process.env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || serverActionsManifest.encryptionKey' \
            /web/node_modules/next/dist/server/app-render/encryption-utils.js
      - name: The launcher's relay reaches a stub API at the fixed address on an internal network (owner #52, #55)
        run: |
          d="$RUNNER_TEMP/web-secrets"
          trap 'docker rm -f web-relay-ci api-stub-ci >/dev/null 2>&1 || true; docker network rm web-api-ci >/dev/null 2>&1 || true' EXIT
          docker network create --internal --subnet 10.231.78.0/24 --ip-range 10.231.78.128/25 web-api-ci
          docker run -d --name api-stub-ci --network web-api-ci --ip 10.231.78.10 --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node divesafe-web-ci \
            -e 'require("http").createServer((q,r)=>{r.writeHead(q.url==="/health"?200:404);r.end()}).listen(8000,"0.0.0.0")'
          docker run -d --name web-relay-ci --network web-api-ci --read-only --init \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev --memory 512m --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$d:/run/secrets:ro" divesafe-web-ci
          ok=
          for _ in $(seq 60); do
            if docker exec web-relay-ci node -e 'fetch("http://127.0.0.1:8000/health",{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))'; then ok=1; break; fi
            sleep 1
          done
          docker logs web-relay-ci 2>&1 | tail -20
          test -n "$ok"
