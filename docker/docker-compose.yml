# Local development stack. Run from the repo root:
#   docker compose -f docker/docker-compose.yml --env-file .env up --build
# POSTGRES_PASSWORD must be set in .env (no default). Ports bind to loopback only.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: divesafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: divesafe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divesafe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      # Local development only: no TLS and the owner role. Production needs sslmode=require or
      # stricter and a least-privilege role (docs/adr/0012). Run db_init once before first use:
      #   docker compose run --rm api python -m divesafe.services.db_init
      DIVESAFE_DATABASE_URL: postgresql://divesafe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/divesafe
      DIVESAFE_ADMIN_DATABASE_URL: postgresql://divesafe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/divesafe
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
