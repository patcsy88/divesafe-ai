# Production stack for the API (ADR 0024, PROPOSED). The development stack is docker-compose.yml.
# Started on a developer machine with throwaway secrets, and one assessment went through on the
# owner's host: do not treat this as a tested deployment (see "Conditions before acceptance" in the ADR).
#
#   docker/make-secrets.sh docker/secrets                  # database secrets; see the ADR for the rest
#   cp docker/production.env.example docker/production.env  # fill in the blanks, incl. DIVESAFE_CORPUS_DIR,
#                                      #    DIVESAFE_RULESET_FILE and DIVESAFE_RULESET_SHA256
#   C() { docker compose -f docker/docker-compose.production.yml --env-file docker/production.env "$@"; }
#   C up -d --wait db                  # 1. the database only   (a function: works in bash and zsh;
#                                      #    a string C="..." with $C runs nothing in zsh)
#   (2. the loader role script: the exact command is in docs/knowledge-loader.md, section 2;
#       without it db-init refuses with LOADER_ROLE_MISSING)
#   C up -d --build --wait api         # 3. db-init, then the API
#
# Update this checkout from a shell with `umask 022` (ADR 0017 #72b): bind-mounted db files keep
# their host modes.
# Build only from the commit you deploy. Never use --build or `build` with --profile knowledge:
# the loaders share the api image tag, so a build there would replace the running api's image.
#
# What is NOT here: TLS in front of the API (put your own reverse proxy in front of 127.0.0.1:8000;
# the web UI is behind the caddy service, ADR 0017 Amendment 2026-11-24), a backup schedule (docker/backup.sh and restore.sh exist:
# docs/backup-and-restore.md), and the signed ruleset itself (a host file outside the repository,
# mounted read-only into the api).
# No secret is in this file or passed through the environment: each one is mounted as a file into
# only the service that needs it.
name: divesafe-prod

services:
  # One-off: a self-signed certificate for the database, created in a volume the first time (and
  # again when it has under 30 days left). Nothing is stored in the repository.
  db-tls:
    image: pgvector/pgvector:pg16
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /tls
        if [ ! -s server.crt ] || ! openssl x509 -in server.crt -noout -checkend 2592000; then
          openssl req -x509 -newkey rsa:3072 -nodes -days 365 -subj "/CN=db" \
            -addext "subjectAltName=DNS:db" -keyout server.key -out server.crt
        fi
        chown 999:999 server.key server.crt
        chmod 0600 server.key
        chmod 0644 server.crt
    volumes:
      - db-tls:/tls
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # The image makes this role a superuser. It is reachable through the local socket only.
      POSTGRES_USER: divesafe_bootstrap
      POSTGRES_DB: divesafe
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
    # Only TLS connections from three named roles are accepted (db/pg_hba.conf). The owner and app
    # roles are created on the first start of an empty volume by db/10-create-app-role.sh; the
    # loader role by hand with db/20-create-loader-role.sql (docs/knowledge-loader.md), never here.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    secrets:
      - db_bootstrap_password
      - db_owner_password
      - db_app_password
      - db_loader_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-tls:/tls:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    networks: [data]
    depends_on:
      db-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divesafe_bootstrap -d divesafe"]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]

  # One-off: installs or upgrades the schema as the owner role (not a superuser) and grants the API
  # role SELECT/INSERT/UPDATE, and DELETE on pending_runs only (ADR 0012, 0015). It is the only service that sees the owner DSN.
  db-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: divesafe-api:local
    restart: "no"
    command: ["python", "-m", "divesafe.services.db_init"]
    environment:
      DIVESAFE_SECRETS_DIR: /run/secrets
      DIVESAFE_APP_DB_ROLE: divesafe_app
      DIVESAFE_LOADER_DB_ROLE: divesafe_loader
    secrets:
      - source: admin_database_url
        target: divesafe_admin_database_url
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: divesafe-api:local
    restart: unless-stopped
    environment:
      DIVESAFE_ENVIRONMENT: production
      DIVESAFE_LOG_LEVEL: INFO
      DIVESAFE_SECRETS_DIR: /run/secrets
      # The agent stage cannot be off in production (ADR 0023). Every assessment sends its plan
      # fields, evidence, rule results and findings to this host, so the external opt-in is stated here, on purpose.
      DIVESAFE_LLM_PROVIDER: openai_compatible
      DIVESAFE_ALLOW_EXTERNAL_LLM: "true"
      DIVESAFE_LLM_BASE_URL: ${DIVESAFE_LLM_BASE_URL:?set DIVESAFE_LLM_BASE_URL in docker/production.env}
      DIVESAFE_LLM_ALLOWED_HOSTS: ${DIVESAFE_LLM_ALLOWED_HOSTS:?set DIVESAFE_LLM_ALLOWED_HOSTS in docker/production.env}
      DIVESAFE_LLM_MODEL: ${DIVESAFE_LLM_MODEL:?set DIVESAFE_LLM_MODEL in docker/production.env}
      # ADR 0028: empty keeps every knowledge item withheld from the model host. Set it to that
      # host only after every APPROVED knowledge version attests model-host egress.
      DIVESAFE_LLM_KNOWLEDGE_HOST: ${DIVESAFE_LLM_KNOWLEDGE_HOST:-}
      # The first real run at the 1500 default lost four agent calls to the token limit (ADR 0024).
      # Evaluation runs 2 and 3 used these three values together (docs/evaluation-strategy.md).
      DIVESAFE_LLM_MAX_OUTPUT_TOKENS: ${DIVESAFE_LLM_MAX_OUTPUT_TOKENS:-3000}
      DIVESAFE_LLM_CALL_TIMEOUT_SECONDS: ${DIVESAFE_LLM_CALL_TIMEOUT_SECONDS:-120}
      DIVESAFE_LLM_STAGE_TIMEOUT_SECONDS: ${DIVESAFE_LLM_STAGE_TIMEOUT_SECONDS:-300}
      # No built-in default: without it no assessment can be created (HTTP 503).
      DIVESAFE_EVIDENCE_MAX_AGE_MINUTES: ${DIVESAFE_EVIDENCE_MAX_AGE_MINUTES:?set DIVESAFE_EVIDENCE_MAX_AGE_MINUTES in docker/production.env}
      # Owner decision 2026-10-18: 180 minutes. Overriding the default needs a recorded reason.
      DIVESAFE_DECISION_MAX_AGE_MINUTES: ${DIVESAFE_DECISION_MAX_AGE_MINUTES:-180}
      # web's fixed address on web-api, and nothing else (ADR 0017 Amendment 2026-11-24). Not read
      # from production.env, so it cannot be widened there.
      # The API keeps an X-Request-ID from a trusted proxy, and web never forwards a client's: it
      # sends only Accept, Authorization, X-Forwarded-For, Content-Type and Idempotency-Key
      # (pinned by web/tests/login.test.ts).
      DIVESAFE_TRUSTED_PROXIES: "10.231.78.20"
      # ADR 0027 item 2: scrapes of /metrics per key per minute (operational, not a safety limit).
      DIVESAFE_RATE_LIMIT_METRICS_PER_MINUTE: ${DIVESAFE_RATE_LIMIT_METRICS_PER_MINUTE:-30}
      # ADR 0027 amendment: off unless production.env sets both; start-up refuses either alone,
      # any endpoint but http://<private IPv4>:<port>/api/public/otel/v1/traces, and OTEL_*.
      DIVESAFE_TRACING_ENABLED: ${DIVESAFE_TRACING_ENABLED:-false}
      DIVESAFE_TRACE_ENDPOINT: ${DIVESAFE_TRACE_ENDPOINT:-}
      # ADR 0029: tides.today, default false. The provider's permission covers only the
      # owner's deployment (ADR 0029 status); true also needs the API key file filled in, or
      # start-up refuses.
      DIVESAFE_TIDES_TODAY_ENABLED: ${DIVESAFE_TIDES_TODAY_ENABLED:-false}
      # The signed-off ruleset (ADR 0009) is required: the file at DIVESAFE_RULESET_FILE is
      # mounted read-only at this fixed path, and start-up refuses a SHA-256 mismatch, an expired
      # or refused definition, or a missing file.
      DIVESAFE_RULESET_PATH: /ruleset/ruleset.json
      DIVESAFE_RULESET_SHA256: ${DIVESAFE_RULESET_SHA256:?set DIVESAFE_RULESET_SHA256 in docker/production.env}
      # ADR 0008 Amendments 1 and 2: DEGRADED evidence may support GO and CAUTION. Start-up
      # refuses true unless the ruleset above is loaded with its pin. Before switching on, check
      # that the deployed web build includes DegradedEvidenceNote (ADR 0008).
      DIVESAFE_DEGRADED_MAY_SUPPORT_GO: ${DIVESAFE_DEGRADED_MAY_SUPPORT_GO:-false}
    secrets:
      - source: database_url
        target: divesafe_database_url
      - source: llm_api_key
        target: divesafe_llm_api_key
      - source: api_key_hashes
        target: divesafe_api_key_hashes
      - source: met_api_token
        target: divesafe_met_api_token
      # tides.today (ADR 0029): an empty file means "not set"; enabling also needs the setting.
      - source: tides_today_api_key
        target: divesafe_tides_today_api_key
      # The Langfuse production project's keys; an empty file means "not set".
      - source: trace_public_key
        target: divesafe_trace_public_key
      - source: trace_secret_key
        target: divesafe_trace_secret_key
    # One file, read-only. The long form refuses a missing host file; the short form would
    # create a directory there as root.
    volumes:
      - type: bind
        source: ${DIVESAFE_RULESET_FILE:?set DIVESAFE_RULESET_FILE in docker/production.env}
        target: /ruleset/ruleset.json
        read_only: true
        bind:
          create_host_path: false
    # The web relay reaches the API at this fixed address, never by name (owner #52a).
    networks:
      data: {}
      egress: {}
      divesafe-trace: {}
      web-api:
        ipv4_address: 10.231.78.10
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Web UI (ADR 0017). Always name the services: a bare `up` would start web too. The first time,
  # recreate the API once so it joins web-api at its fixed address, then start web on its own:
  #   C up -d --no-build --wait api
  #   docker tag divesafe-web:local divesafe-web:rollback-<date>   # before each --build
  #   C up -d --build --wait web
  # Roll back by tagging the old image as divesafe-web:local and `C up -d --no-build --wait web`.
  # Its two secrets are files, like every other secret (owner #50a); docker/web-start.cjs reads them
  # at start, never at build (owner #47a). Not published: its only way in is the caddy service
  # (ADR 0017 Amendment 2026-11-24).
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: divesafe-web:local
    pull_policy: build
    restart: unless-stopped
    # A small init as PID 1, so `docker stop` ends Next promptly (owner #54a).
    init: true
    environment:
      # The web server accepts http on loopback only; the launcher's relay forwards it to the API
      # (owner #48a, #55a).
      DIVESAFE_API_URL: http://127.0.0.1:8000
      # Caddy is web's only way in and sets X-Forwarded-For to exactly one address: the device's on
      # the home network, or the one Pangolin reports on the public path (so Pangolin is trusted
      # there). web believes it. Never 1 while anything else can reach web's port.
      DIVESAFE_WEB_TRUST_PROXY: "1"
      # The Host names web answers to: the two Caddy sites and the healthcheck's loopback name.
      # web refuses to start if this is missing or empty.
      DIVESAFE_WEB_ALLOWED_HOSTS: "${DIVESAFE_WEB_LAN_NAME:?set DIVESAFE_WEB_LAN_NAME in docker/production.env},${DIVESAFE_WEB_PUBLIC_NAME:?set DIVESAFE_WEB_PUBLIC_NAME in docker/production.env},127.0.0.1:3100"
    secrets:
      - source: web_session_secret
        target: divesafe_web_session_secret
      - source: web_actions_key
        target: divesafe_web_actions_key
    # Both networks are internal, so web has no route out. Fixed addresses outside each ip_range:
    # caddy dials 10.231.79.20 (never the name `web`, since caddy has a route out), and the API
    # trusts X-Forwarded-For from 10.231.78.20 only.
    networks:
      web-proxy:
        ipv4_address: 10.231.79.20
      web-api:
        ipv4_address: 10.231.78.20
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3100/login",{signal:AbortSignal.timeout(3000)})
          .then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The TLS proxy in front of web, and web's only way in (ADR 0017 Amendment 2026-11-24, ADR 0024
  # Amendment 2). Two sites, no catch-all (docker/Caddyfile): <name>.home.arpa with Caddy's local
  # CA on the published LAN port, and the public name as plain http for Newt on pangolin-edge.
  # The admin endpoint is off. Start it on its own after web:
  #   C up -d --wait caddy
  # The local CA's root is in the caddy-data volume (pki/authorities/local/root.crt): install it on
  # each device that uses the LAN name. Access logs are in the same volume (logs/), 14 days.
  caddy:
    # The official image, pinned by digest (multi-arch index of caddy:2.11.9-alpine).
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    # Unprivileged: it listens on 8443 and 8080 only. The image's /data/caddy and /config/caddy
    # are mode 1777, and Docker copies that into a new volume, so nobody can write there.
    user: "65534:65534"
    environment:
      DIVESAFE_WEB_LAN_NAME: ${DIVESAFE_WEB_LAN_NAME:?set DIVESAFE_WEB_LAN_NAME in docker/production.env}
      DIVESAFE_WEB_PUBLIC_NAME: ${DIVESAFE_WEB_PUBLIC_NAME:?set DIVESAFE_WEB_PUBLIC_NAME in docker/production.env}
    # The long form refuses a missing host file; the short form would create a directory there.
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    # Fixed addresses, each outside its network's ip_range; the two sites bind to the first two.
    networks:
      web-ingress:
        ipv4_address: 10.231.81.10
      pangolin-edge:
        ipv4_address: 10.231.80.10
      web-proxy:
        ipv4_address: 10.231.79.10
    # The VM's LAN address only; never 0.0.0.0, and no other port.
    ports:
      - "${DIVESAFE_LAN_ADDRESS:?set DIVESAFE_LAN_ADDRESS in docker/production.env}:443:8443"
    # Both listeners accept connections. No admin API is needed.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 10.231.81.10 8443 && nc -z -w 2 10.231.80.10 8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    mem_limit: 256m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-off, never started by `up` (ADR 0024 Amendment 1, A3; docs/knowledge-loader.md):
  #   docker compose ... --profile knowledge run --rm kb_load load --approved-manifest-sha256 <hash>
  # The approved hash is an argument only: no setting, secret or file here may carry it.
  kb_load:
    profiles: [knowledge]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: divesafe-api:local
    restart: "no"
    entrypoint: ["python", "-m", "divesafe.services.kb_load"]
    environment:
      DIVESAFE_ENVIRONMENT: production
      DIVESAFE_SECRETS_DIR: /run/secrets
      DIVESAFE_CORPUS_TARGET: /corpus
    secrets:
      - source: loader_database_url
        target: divesafe_loader_database_url
    # The long form refuses a missing host directory; the short form would create it as root.
    volumes:
      - type: bind
        source: ${DIVESAFE_CORPUS_DIR:?set DIVESAFE_CORPUS_DIR in docker/production.env}
        target: /corpus
        read_only: true
        bind:
          create_host_path: false
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-off, never started by `up`: withdraw only, with no corpus mount, so nothing about the
  # corpus can stop a withdrawal. docker compose ... --profile knowledge run --rm kb_withdraw <id> <version>
  kb_withdraw:
    profiles: [knowledge]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: divesafe-api:local
    restart: "no"
    entrypoint: ["python", "-m", "divesafe.services.kb_withdraw", "withdraw"]
    environment:
      DIVESAFE_ENVIRONMENT: production
      DIVESAFE_SECRETS_DIR: /run/secrets
    secrets:
      - source: loader_database_url
        target: divesafe_loader_database_url
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  # No route out: the database and the one-off schema job live here.
  data:
    internal: true
  # Outbound access for the API only (the model host and the data sources).
  egress: {}
  # Caddy's published LAN port, and caddy only (ADR 0017 Amendment 2026-11-24). Not internal:
  # Docker cannot publish a port from an internal network (owner #49a), so caddy has a route out.
  # caddy has the fixed address 10.231.81.10, outside `ip_range`, and the LAN site binds to it.
  web-ingress:
    ipam:
      config:
        - subnet: 10.231.81.0/24
          ip_range: 10.231.81.128/25
  # No route out: caddy to web only. caddy has 10.231.79.10 and web 10.231.79.20, both outside
  # `ip_range`.
  web-proxy:
    internal: true
    ipam:
      config:
        - subnet: 10.231.79.0/24
          ip_range: 10.231.79.128/25
  # No route out: Newt to caddy's plain-http public site only (#100a). caddy (10.231.80.10) is the
  # only service of this project on it; Newt joins it from its own compose as `external: true`,
  # at 10.231.80.20, the one address caddy's public listener trusts. Both are outside `ip_range`.
  pangolin-edge:
    name: pangolin-edge
    internal: true
    ipam:
      config:
        - subnet: 10.231.80.0/24
          ip_range: 10.231.80.128/25
  # No route out: the web launcher's relay to the API only. The API has the fixed address
  # 10.231.78.10 and web 10.231.78.20, both outside `ip_range`, so no other container is ever
  # given them (owner #52a); the API trusts X-Forwarded-For from 10.231.78.20 only. The
  # subnet avoids the LAN, Tailscale, Docker Desktop's ranges and divesafe-trace; no test can see
  # a host route, so check `netstat -rn` on a new host.
  web-api:
    internal: true
    ipam:
      config:
        - subnet: 10.231.78.0/24
          ip_range: 10.231.78.128/25
  # ADR 0027 amendment: spans to the local Langfuse only. No route out; joined only by the API
  # and Langfuse's web container (its own compose, `external: true`), which has the fixed
  # address 10.231.77.10, outside `ip_range`, so no other container is ever given it. The
  # subnet avoids the LAN, Tailscale and Docker Desktop's ranges. Tracing is off unless
  # production.env switches it on.
  divesafe-trace:
    name: divesafe-trace
    internal: true
    ipam:
      config:
        - subnet: 10.231.77.0/24
          ip_range: 10.231.77.128/25

volumes:
  db-data:
  db-tls:
  # Caddy's local CA (its key included), its certificates and the access logs.
  caddy-data:
  caddy-config:

secrets:
  db_bootstrap_password:
    file: ./secrets/db_bootstrap_password
  db_owner_password:
    file: ./secrets/db_owner_password
  db_app_password:
    file: ./secrets/db_app_password
  db_loader_password:
    file: ./secrets/db_loader_password
  admin_database_url:
    file: ./secrets/divesafe_admin_database_url
  database_url:
    file: ./secrets/divesafe_database_url
  llm_api_key:
    file: ./secrets/divesafe_llm_api_key
  api_key_hashes:
    file: ./secrets/divesafe_api_key_hashes
  met_api_token:
    file: ./secrets/divesafe_met_api_token
  tides_today_api_key:
    file: ./secrets/divesafe_tides_today_api_key
  loader_database_url:
    file: ./secrets/divesafe_loader_database_url
  trace_public_key:
    file: ./secrets/divesafe_trace_public_key
  trace_secret_key:
    file: ./secrets/divesafe_trace_secret_key
  web_session_secret:
    file: ./secrets/divesafe_web_session_secret
  web_actions_key:
    file: ./secrets/divesafe_web_actions_key
