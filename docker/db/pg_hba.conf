# Used by the production database (docker-compose.production.yml, ADR 0024).
# The bootstrap superuser reaches the server only through the local socket (inside the container).
# Over the network only two named roles may connect, only to the application database, only with
# TLS and a SCRAM password. Every other connection, including a plaintext one, matches no rule and
# is refused. Only the "data" network, which has no route out, reaches the server.
local   all        all                                scram-sha-256
hostssl divesafe   divesafe_owner   samenet           scram-sha-256
hostssl divesafe   divesafe_app     samenet           scram-sha-256
