[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divesafe"
version = "0.1.0"
description = "Agentic environmental risk assessment and decision support for recreational diving."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  # 0.143: automatic OpenTelemetry export is opt-in; `create_app` turns all of it off.
  "fastapi>=0.143,<1",
  # ADR 0027 amendment: tracing to the local Langfuse; imported only when tracing is enabled.
  "opentelemetry-sdk>=1.45.2,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2,<1.46",
  # ADR 0027 item 2: `/metrics`; imported only by `api/metrics.py` (Apache-2.0 AND BSD-2-Clause).
  "prometheus_client>=0.26,<0.27",
  # Imported directly by the trace session (redirect, proxy and environment behaviour pinned);
  # 2.32.4 fixes the .netrc credential leak (CVE-2024-47081).
  "requests>=2.32.4,<3",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary]>=3.1,<4",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/divesafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "safety: tests that protect the deterministic safety hierarchy (must never be skipped)",
  "integration: tests that need external services (database, network)",
]

[tool.ruff]
line-length = 100
# Syntax style only; the runtime floor is requires-python (3.14, ADR 0022 Unicode gate).
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The form script holds the form's prose as long string literals.
"docs/domain-validation/build_form.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
